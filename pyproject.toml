[project]
name = "ticketflow"
version = "0.1.0"
description = "Lifecycle of a support-ticket routing model: data versioning, training, quality gates, shadow/canary rollout, drift monitoring, retraining."
authors = [{ name = "Косенков Владислав Викторович", email = "sinerror.sin@gmail.com" }]
requires-python = ">=3.11,<3.13"
# Minimal runtime needed by the inference service (CPU, no torch).
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tokenizers>=0.20",
    "onnxruntime>=1.19",
    "mlflow-skinny>=2.16",
    "boto3>=1.34",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Everything needed to prepare data, train, evaluate, export and monitor.
pipeline = [
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.44",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "mlflow>=2.16",
    "datasets>=3.0",
    "evidently>=0.7",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "dvc[s3]>=3.50"]

[project.scripts]
ticketflow = "ticketflow.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
