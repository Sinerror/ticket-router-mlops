name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      # CPU torch on Linux: the CUDA index in pyproject is scoped to Windows.
      - run: uv sync --extra pipeline
      - run: uv run ruff check src tests dags
      - run: uv run pytest -q

  # Quality gate in CI: train a small model on the data and fail the job if it does not pass the gate.
  gate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[train]')
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra pipeline
      - run: uv run dvc repro prepare
      - name: train + quality gate (exit code 3 = blocked by the gate)
        run: uv run ticketflow train --trigger ci
      - uses: actions/upload-artifact@v4
        with:
          name: golden-metrics
          path: artifacts/candidates/bootstrap/golden_metrics.json

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/service.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/ticket-router:${{ github.sha }}
